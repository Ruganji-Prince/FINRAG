services:
  db:
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: finrag
      POSTGRES_USER: finrag_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FINRAG_WRITER_PASSWORD: ${FINRAG_WRITER_PASSWORD:?Set FINRAG_WRITER_PASSWORD in .env}
      FINRAG_READER_PASSWORD: ${FINRAG_READER_PASSWORD:?Set FINRAG_READER_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-reader.sh:/docker-entrypoint-initdb.d/10-reader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finrag_admin -d finrag"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    profiles: ["app"]
    build: .
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    image: finrag:local
    command: ["python", "-m", "backend.migrate"]
    environment:
      DATABASE_URL: postgresql://finrag:${FINRAG_WRITER_PASSWORD}@db:5432/finrag
      QUERY_DATABASE_URL: postgresql://finrag:${FINRAG_WRITER_PASSWORD}@db:5432/finrag
      EMBEDDING_BACKEND: sentence-transformers
    volumes:
      - models:/app/.models
    depends_on:
      db:
        condition: service_healthy
  api:
    profiles: ["app"]
    build: .
    mem_limit: 10g
    cpus: 4.0
    pids_limit: 256
    restart: unless-stopped
    image: finrag:local
    environment:
      DATABASE_URL: postgresql://finrag_reader:${FINRAG_READER_PASSWORD}@db:5432/finrag
      QUERY_DATABASE_URL: postgresql://finrag_reader:${FINRAG_READER_PASSWORD}@db:5432/finrag
      PUBLIC_MODE: ${PUBLIC_MODE:-false}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
      AUTO_MIGRATE: "false"
      EMBEDDING_BACKEND: sentence-transformers
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - models:/app/.models
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 6
    profiles: ["app"]
    build: .
    image: finrag:local
    command: ["python", "-m", "streamlit", "run", "app/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      API_URL: http://api:8000
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
  models:
